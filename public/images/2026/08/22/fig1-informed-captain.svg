<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#fcfcfb"/>

  <!-- ===== Left panel: pyramid ===== -->
  <text x="200" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">전통적 피라미드</text>
  <text x="200" y="64" text-anchor="middle" font-size="13" fill="#52514e">맥락은 아래에, 결정은 위에</text>

  <!-- boss -->
  <circle cx="200" cy="120" r="24" fill="none" stroke="#52514e" stroke-width="2"/>
  <text x="200" y="125" text-anchor="middle" font-size="12" fill="#0b0b0b">상사</text>
  <rect x="163" y="152" width="74" height="22" rx="11" fill="#eb6834"/>
  <text x="200" y="167" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">결정</text>

  <!-- members -->
  <g>
    <circle cx="110" cy="280" r="22" fill="none" stroke="#a8a7a1" stroke-width="2"/>
    <circle cx="200" cy="280" r="22" fill="none" stroke="#a8a7a1" stroke-width="2"/>
    <circle cx="290" cy="280" r="22" fill="none" stroke="#a8a7a1" stroke-width="2"/>
  </g>
  <rect x="146" y="316" width="108" height="22" rx="11" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="200" y="331" text-anchor="middle" font-size="12" font-weight="600" fill="#2a78d6">맥락은 여기에</text>

  <!-- arrows up (요청) and down (지시) -->
  <line x1="176" y1="252" x2="192" y2="184" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="208" y1="184" x2="224" y2="252" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="146" y="220" text-anchor="end" font-size="11" fill="#52514e">결정 요청</text>
  <text x="254" y="220" text-anchor="start" font-size="11" fill="#52514e">지시</text>

  <!-- divider -->
  <line x1="400" y1="30" x2="400" y2="370" stroke="#e5e4e0" stroke-width="1"/>

  <!-- ===== Right panel: informed captain ===== -->
  <text x="600" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Informed Captain</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#52514e">맥락을 가진 사람이 결정한다</text>

  <!-- leader (context setter) -->
  <circle cx="600" cy="120" r="24" fill="none" stroke="#52514e" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-size="12" fill="#0b0b0b">리드</text>

  <!-- context arrow down -->
  <line x1="600" y1="150" x2="600" y2="242" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="612" y="200" text-anchor="start" font-size="11" fill="#52514e">맥락 · 정렬</text>

  <!-- peers with captain in middle -->
  <circle cx="510" cy="280" r="22" fill="none" stroke="#a8a7a1" stroke-width="2"/>
  <circle cx="600" cy="280" r="22" fill="#2a78d6"/>
  <text x="600" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">캡틴</text>
  <circle cx="690" cy="280" r="22" fill="none" stroke="#a8a7a1" stroke-width="2"/>

  <!-- advice arrows from peers -->
  <line x1="536" y1="280" x2="572" y2="280" stroke="#a8a7a1" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="664" y1="280" x2="628" y2="280" stroke="#a8a7a1" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#arrow)"/>
  <text x="600" y="252" text-anchor="middle" font-size="11" fill="#52514e" opacity="0"></text>
  <text x="600" y="318" text-anchor="middle" font-size="11" fill="#52514e">의견 수집 (farming for dissent)</text>

  <!-- decision badge -->
  <rect x="563" y="330" width="74" height="22" rx="11" fill="#2a78d6"/>
  <text x="600" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">결정</text>
</svg>
